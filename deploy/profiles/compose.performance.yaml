# ACE-Step 1.5 docker-server performance profile (Profile A).
# Merge after the deployment's base Compose file; this file changes environment only.
services:
  acestep:
    environment:
      ACESTEP_CONFIG_PATH: acestep-v15-xl-turbo
      ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-4B
      ACESTEP_LLM_BACKEND: vllm
      ACESTEP_USE_FLASH_ATTENTION: "true"
      ACESTEP_OFFLOAD_TO_CPU: "false"
      ACESTEP_OFFLOAD_DIT_TO_CPU: "false"
      ACESTEP_EXTRA_ARGS: --batch_size 1
